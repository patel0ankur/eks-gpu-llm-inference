# Grafana dashboard "Workload: vLLM on each GPU": vLLM queue, tokens and latency per Pod,
# joined with the DCGM metrics of the GPU each Pod uses. Loaded by the Grafana dashboard sidecar.
# Apply with:  kubectl apply -f k8s/monitoring/06-vllm-dashboard.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: vllm-workload-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  vllm-workload.json: |
    {
     "uid": "vllm-workload",
     "title": "Workload: vLLM on each GPU",
     "tags": [
      "vllm",
      "gpu",
      "llm",
      "eks"
     ],
     "timezone": "browser",
     "schemaVersion": 39,
     "version": 1,
     "refresh": "15s",
     "time": {
      "from": "now-1h",
      "to": "now"
     },
     "links": [
      {
       "title": "GPU / NVIDIA DCGM (A10G)",
       "type": "link",
       "url": "/d/gpu-dcgm",
       "icon": "dashboard"
      }
     ],
     "templating": {
      "list": [
       {
        "name": "datasource",
        "type": "datasource",
        "query": "prometheus",
        "current": {
         "text": "Prometheus",
         "value": "prometheus"
        },
        "label": "Data source"
       },
       {
        "name": "pod",
        "type": "query",
        "label": "vLLM Pod",
        "datasource": {
         "type": "prometheus",
         "uid": "${datasource}"
        },
        "query": {
         "query": "label_values(vllm:num_requests_running, pod)",
         "refId": "pod"
        },
        "definition": "label_values(vllm:num_requests_running, pod)",
        "refresh": 2,
        "includeAll": true,
        "multi": true,
        "allValue": ".*",
        "current": {
         "text": [
          "All"
         ],
         "value": [
          "$__all"
         ]
        }
       }
      ]
     },
     "panels": [
      {
       "id": 1,
       "type": "stat",
       "title": "vLLM replicas up",
       "description": "vLLM Pods Prometheus can scrape",
       "datasource": {
        "type": "prometheus",
        "uid": "${datasource}"
       },
       "gridPos": {
        "x": 0,
        "y": 0,
        "w": 4,
        "h": 4
       },
       "fieldConfig": {
        "defaults": {
         "unit": "none",
         "thresholds": {
          "mode": "absolute",
          "steps": [
           {
            "color": "green",
            "value": null
           }
          ]
         }
        },
        "overrides": []
       },
       "options": {
        "reduceOptions": {
         "calcs": [
          "lastNotNull"
         ]
        },
        "colorMode": "background",
        "graphMode": "area",
        "textMode": "auto"
       },
       "targets": [
        {
         "refId": "A",
         "expr": "count(up{job=\"monitoring/vllm\",pod=~\"$pod\"} == 1)"
        }
       ]
      },
      {
       "id": 2,
       "type": "stat",
       "title": "Requests running",
       "description": "",
       "datasource": {
        "type": "prometheus",
        "uid": "${datasource}"
       },
       "gridPos": {
        "x": 4,
        "y": 0,
        "w": 4,
        "h": 4
       },
       "fieldConfig": {
        "defaults": {
         "unit": "short",
         "thresholds": {
          "mode": "absolute",
          "steps": [
           {
            "color": "green",
            "value": null
           }
          ]
         }
        },
        "overrides": []
       },
       "options": {
        "reduceOptions": {
         "calcs": [
          "lastNotNull"
         ]
        },
        "colorMode": "background",
        "graphMode": "area",
        "textMode": "auto"
       },
       "targets": [
        {
         "refId": "A",
         "expr": "sum(vllm:num_requests_running{pod=~\"$pod\"})"
        }
       ]
      },
      {
       "id": 3,
       "type": "stat",
       "title": "Requests waiting",
       "description": "Above 0 = the GPUs are full and requests queue",
       "datasource": {
        "type": "prometheus",
        "uid": "${datasource}"
       },
       "gridPos": {
        "x": 8,
        "y": 0,
        "w": 4,
        "h": 4
       },
       "fieldConfig": {
        "defaults": {
         "unit": "short",
         "thresholds": {
          "mode": "absolute",
          "steps": [
           {
            "color": "green",
            "value": null
           },
           {
            "color": "orange",
            "value": 1
           },
           {
            "color": "red",
            "value": 10
           }
          ]
         }
        },
        "overrides": []
       },
       "options": {
        "reduceOptions": {
         "calcs": [
          "lastNotNull"
         ]
        },
        "colorMode": "background",
        "graphMode": "area",
        "textMode": "auto"
       },
       "targets": [
        {
         "refId": "A",
         "expr": "sum(vllm:num_requests_waiting{pod=~\"$pod\"})"
        }
       ]
      },
      {
       "id": 4,
       "type": "stat",
       "title": "Output tokens/s",
       "description": "",
       "datasource": {
        "type": "prometheus",
        "uid": "${datasource}"
       },
       "gridPos": {
        "x": 12,
        "y": 0,
        "w": 4,
        "h": 4
       },
       "fieldConfig": {
        "defaults": {
         "unit": "short",
         "thresholds": {
          "mode": "absolute",
          "steps": [
           {
            "color": "green",
            "value": null
           }
          ]
         },
         "decimals": 0
        },
        "overrides": []
       },
       "options": {
        "reduceOptions": {
         "calcs": [
          "lastNotNull"
         ]
        },
        "colorMode": "background",
        "graphMode": "area",
        "textMode": "auto"
       },
       "targets": [
        {
         "refId": "A",
         "expr": "sum(rate(vllm:generation_tokens_total{pod=~\"$pod\"}[1m]))"
        }
       ]
      },
      {
       "id": 5,
       "type": "stat",
       "title": "TTFT p95",
       "description": "Time to first token, all Pods",
       "datasource": {
        "type": "prometheus",
        "uid": "${datasource}"
       },
       "gridPos": {
        "x": 16,
        "y": 0,
        "w": 4,
        "h": 4
       },
       "fieldConfig": {
        "defaults": {
         "unit": "s",
         "thresholds": {
          "mode": "absolute",
          "steps": [
           {
            "color": "green",
            "value": null
           },
           {
            "color": "orange",
            "value": 0.5
           },
           {
            "color": "red",
            "value": 2
           }
          ]
         }
        },
        "overrides": []
       },
       "options": {
        "reduceOptions": {
         "calcs": [
          "lastNotNull"
         ]
        },
        "colorMode": "background",
        "graphMode": "area",
        "textMode": "auto"
       },
       "targets": [
        {
         "refId": "A",
         "expr": "histogram_quantile(0.95, sum by (le) (rate(vllm:time_to_first_token_seconds_bucket{pod=~\"$pod\"}[1m])))"
        }
       ]
      },
      {
       "id": 6,
       "type": "stat",
       "title": "Max KV cache used",
       "description": "",
       "datasource": {
        "type": "prometheus",
        "uid": "${datasource}"
       },
       "gridPos": {
        "x": 20,
        "y": 0,
        "w": 4,
        "h": 4
       },
       "fieldConfig": {
        "defaults": {
         "unit": "percent",
         "thresholds": {
          "mode": "absolute",
          "steps": [
           {
            "color": "green",
            "value": null
           },
           {
            "color": "orange",
            "value": 80
           },
           {
            "color": "red",
            "value": 95
           }
          ]
         },
         "decimals": 1
        },
        "overrides": []
       },
       "options": {
        "reduceOptions": {
         "calcs": [
          "lastNotNull"
         ]
        },
        "colorMode": "background",
        "graphMode": "area",
        "textMode": "auto"
       },
       "targets": [
        {
         "refId": "A",
         "expr": "max(vllm:kv_cache_usage_perc{pod=~\"$pod\"}) * 100"
        }
       ]
      },
      {
       "id": 100,
       "type": "row",
       "title": "Load and queue",
       "collapsed": false,
       "gridPos": {
        "x": 0,
        "y": 4,
        "w": 24,
        "h": 1
       },
       "panels": []
      },
      {
       "id": 7,
       "type": "timeseries",
       "title": "Requests running / waiting",
       "description": "Waiting > 0 means the GPU is truly full.",
       "datasource": {
        "type": "prometheus",
        "uid": "${datasource}"
       },
       "gridPos": {
        "x": 0,
        "y": 5,
        "w": 8,
        "h": 8
       },
       "fieldConfig": {
        "defaults": {
         "unit": "short",
         "min": 0,
         "custom": {
          "lineWidth": 2,
          "fillOpacity": 10
         }
        },
        "overrides": []
       },
       "options": {
        "legend": {
         "displayMode": "table",
         "placement": "bottom",
         "calcs": [
          "lastNotNull",
          "max"
         ]
        },
        "tooltip": {
         "mode": "multi"
        }
       },
       "targets": [
        {
         "refId": "A",
         "expr": "sum by (pod) (vllm:num_requests_running{pod=~\"$pod\"})",
         "legendFormat": "{{pod}} running"
        },
        {
         "refId": "B",
         "expr": "sum by (pod) (vllm:num_requests_waiting{pod=~\"$pod\"})",
         "legendFormat": "{{pod}} waiting"
        }
       ]
      },
      {
       "id": 8,
       "type": "timeseries",
       "title": "Finished requests/s",
       "description": "",
       "datasource": {
        "type": "prometheus",
        "uid": "${datasource}"
       },
       "gridPos": {
        "x": 8,
        "y": 5,
        "w": 8,
        "h": 8
       },
       "fieldConfig": {
        "defaults": {
         "unit": "reqps",
         "min": 0,
         "custom": {
          "lineWidth": 2,
          "fillOpacity": 10
         }
        },
        "overrides": []
       },
       "options": {
        "legend": {
         "displayMode": "table",
         "placement": "bottom",
         "calcs": [
          "lastNotNull",
          "max"
         ]
        },
        "tooltip": {
         "mode": "multi"
        }
       },
       "targets": [
        {
         "refId": "A",
         "expr": "sum by (pod) (rate(vllm:request_success_total{pod=~\"$pod\"}[1m]))",
         "legendFormat": "{{pod}}"
        }
       ]
      },
      {
       "id": 9,
       "type": "timeseries",
       "title": "KV cache used %",
       "description": "Near 100% = new requests wait or get preempted.",
       "datasource": {
        "type": "prometheus",
        "uid": "${datasource}"
       },
       "gridPos": {
        "x": 16,
        "y": 5,
        "w": 8,
        "h": 8
       },
       "fieldConfig": {
        "defaults": {
         "unit": "percent",
         "min": 0,
         "custom": {
          "lineWidth": 2,
          "fillOpacity": 10
         },
         "max": 100
        },
        "overrides": []
       },
       "options": {
        "legend": {
         "displayMode": "table",
         "placement": "bottom",
         "calcs": [
          "lastNotNull",
          "max"
         ]
        },
        "tooltip": {
         "mode": "multi"
        }
       },
       "targets": [
        {
         "refId": "A",
         "expr": "max by (pod) (vllm:kv_cache_usage_perc{pod=~\"$pod\"}) * 100",
         "legendFormat": "{{pod}}"
        }
       ]
      },
      {
       "id": 101,
       "type": "row",
       "title": "Tokens",
       "collapsed": false,
       "gridPos": {
        "x": 0,
        "y": 13,
        "w": 24,
        "h": 1
       },
       "panels": []
      },
      {
       "id": 10,
       "type": "timeseries",
       "title": "Output tokens/s",
       "description": "Useful work per GPU.",
       "datasource": {
        "type": "prometheus",
        "uid": "${datasource}"
       },
       "gridPos": {
        "x": 0,
        "y": 14,
        "w": 8,
        "h": 8
       },
       "fieldConfig": {
        "defaults": {
         "unit": "short",
         "min": 0,
         "custom": {
          "lineWidth": 2,
          "fillOpacity": 10
         }
        },
        "overrides": []
       },
       "options": {
        "legend": {
         "displayMode": "table",
         "placement": "bottom",
         "calcs": [
          "lastNotNull",
          "max"
         ]
        },
        "tooltip": {
         "mode": "multi"
        }
       },
       "targets": [
        {
         "refId": "A",
         "expr": "sum by (pod) (rate(vllm:generation_tokens_total{pod=~\"$pod\"}[1m]))",
         "legendFormat": "{{pod}}"
        }
       ]
      },
      {
       "id": 11,
       "type": "timeseries",
       "title": "Prompt tokens/s",
       "description": "Input processed (prefill).",
       "datasource": {
        "type": "prometheus",
        "uid": "${datasource}"
       },
       "gridPos": {
        "x": 8,
        "y": 14,
        "w": 8,
        "h": 8
       },
       "fieldConfig": {
        "defaults": {
         "unit": "short",
         "min": 0,
         "custom": {
          "lineWidth": 2,
          "fillOpacity": 10
         }
        },
        "overrides": []
       },
       "options": {
        "legend": {
         "displayMode": "table",
         "placement": "bottom",
         "calcs": [
          "lastNotNull",
          "max"
         ]
        },
        "tooltip": {
         "mode": "multi"
        }
       },
       "targets": [
        {
         "refId": "A",
         "expr": "sum by (pod) (rate(vllm:prompt_tokens_total{pod=~\"$pod\"}[1m]))",
         "legendFormat": "{{pod}}"
        }
       ]
      },
      {
       "id": 12,
       "type": "timeseries",
       "title": "Preemptions/min",
       "description": "Requests paused because the KV cache ran out.",
       "datasource": {
        "type": "prometheus",
        "uid": "${datasource}"
       },
       "gridPos": {
        "x": 16,
        "y": 14,
        "w": 8,
        "h": 8
       },
       "fieldConfig": {
        "defaults": {
         "unit": "short",
         "min": 0,
         "custom": {
          "lineWidth": 2,
          "fillOpacity": 10
         }
        },
        "overrides": []
       },
       "options": {
        "legend": {
         "displayMode": "table",
         "placement": "bottom",
         "calcs": [
          "lastNotNull",
          "max"
         ]
        },
        "tooltip": {
         "mode": "multi"
        }
       },
       "targets": [
        {
         "refId": "A",
         "expr": "sum by (pod) (rate(vllm:num_preemptions_total{pod=~\"$pod\"}[5m])) * 60",
         "legendFormat": "{{pod}}"
        }
       ]
      },
      {
       "id": 102,
       "type": "row",
       "title": "Latency (p95)",
       "collapsed": false,
       "gridPos": {
        "x": 0,
        "y": 22,
        "w": 24,
        "h": 1
       },
       "panels": []
      },
      {
       "id": 13,
       "type": "timeseries",
       "title": "Time to first token",
       "description": "How long until text starts.",
       "datasource": {
        "type": "prometheus",
        "uid": "${datasource}"
       },
       "gridPos": {
        "x": 0,
        "y": 23,
        "w": 8,
        "h": 8
       },
       "fieldConfig": {
        "defaults": {
         "unit": "s",
         "min": 0,
         "custom": {
          "lineWidth": 2,
          "fillOpacity": 10
         }
        },
        "overrides": []
       },
       "options": {
        "legend": {
         "displayMode": "table",
         "placement": "bottom",
         "calcs": [
          "lastNotNull",
          "max"
         ]
        },
        "tooltip": {
         "mode": "multi"
        }
       },
       "targets": [
        {
         "refId": "A",
         "expr": "histogram_quantile(0.95, sum by (pod, le) (rate(vllm:time_to_first_token_seconds_bucket{pod=~\"$pod\"}[1m])))",
         "legendFormat": "{{pod}}"
        }
       ]
      },
      {
       "id": 14,
       "type": "timeseries",
       "title": "Time per output token",
       "description": "Streaming speed.",
       "datasource": {
        "type": "prometheus",
        "uid": "${datasource}"
       },
       "gridPos": {
        "x": 8,
        "y": 23,
        "w": 8,
        "h": 8
       },
       "fieldConfig": {
        "defaults": {
         "unit": "s",
         "min": 0,
         "custom": {
          "lineWidth": 2,
          "fillOpacity": 10
         }
        },
        "overrides": []
       },
       "options": {
        "legend": {
         "displayMode": "table",
         "placement": "bottom",
         "calcs": [
          "lastNotNull",
          "max"
         ]
        },
        "tooltip": {
         "mode": "multi"
        }
       },
       "targets": [
        {
         "refId": "A",
         "expr": "histogram_quantile(0.95, sum by (pod, le) (rate(vllm:inter_token_latency_seconds_bucket{pod=~\"$pod\"}[1m])))",
         "legendFormat": "{{pod}}"
        }
       ]
      },
      {
       "id": 15,
       "type": "timeseries",
       "title": "End-to-end request",
       "description": "Whole request inside vLLM, and the part spent queued.",
       "datasource": {
        "type": "prometheus",
        "uid": "${datasource}"
       },
       "gridPos": {
        "x": 16,
        "y": 23,
        "w": 8,
        "h": 8
       },
       "fieldConfig": {
        "defaults": {
         "unit": "s",
         "min": 0,
         "custom": {
          "lineWidth": 2,
          "fillOpacity": 10
         }
        },
        "overrides": []
       },
       "options": {
        "legend": {
         "displayMode": "table",
         "placement": "bottom",
         "calcs": [
          "lastNotNull",
          "max"
         ]
        },
        "tooltip": {
         "mode": "multi"
        }
       },
       "targets": [
        {
         "refId": "A",
         "expr": "histogram_quantile(0.95, sum by (pod, le) (rate(vllm:e2e_request_latency_seconds_bucket{pod=~\"$pod\"}[1m])))",
         "legendFormat": "{{pod}}"
        },
        {
         "refId": "B",
         "expr": "histogram_quantile(0.95, sum by (pod, le) (rate(vllm:request_queue_time_seconds_bucket{pod=~\"$pod\"}[1m])))",
         "legendFormat": "{{pod}} queue"
        }
       ]
      },
      {
       "id": 103,
       "type": "row",
       "title": "The GPU behind each Pod (DCGM)",
       "collapsed": false,
       "gridPos": {
        "x": 0,
        "y": 31,
        "w": 24,
        "h": 1
       },
       "panels": []
      },
      {
       "id": 16,
       "type": "timeseries",
       "title": "GPU utilization % vs Tensor Core %",
       "description": "",
       "datasource": {
        "type": "prometheus",
        "uid": "${datasource}"
       },
       "gridPos": {
        "x": 0,
        "y": 32,
        "w": 8,
        "h": 8
       },
       "fieldConfig": {
        "defaults": {
         "unit": "percent",
         "min": 0,
         "custom": {
          "lineWidth": 2,
          "fillOpacity": 10
         },
         "max": 100
        },
        "overrides": []
       },
       "options": {
        "legend": {
         "displayMode": "table",
         "placement": "bottom",
         "calcs": [
          "lastNotNull",
          "max"
         ]
        },
        "tooltip": {
         "mode": "multi"
        }
       },
       "targets": [
        {
         "refId": "A",
         "expr": "avg by (pod) (DCGM_FI_DEV_GPU_UTIL_RATIO{pod=~\"$pod\"}) * 100",
         "legendFormat": "{{pod}} GPU busy"
        },
        {
         "refId": "B",
         "expr": "avg by (pod) (DCGM_FI_PROF_TENSOR_UTIL_RATIO{pod=~\"$pod\"}) * 100",
         "legendFormat": "{{pod}} Tensor Cores"
        }
       ]
      },
      {
       "id": 17,
       "type": "timeseries",
       "title": "Output tokens per joule",
       "description": "vLLM tokens/s \u00f7 the same Pod's GPU power: joins vLLM and DCGM on the pod label.",
       "datasource": {
        "type": "prometheus",
        "uid": "${datasource}"
       },
       "gridPos": {
        "x": 8,
        "y": 32,
        "w": 8,
        "h": 8
       },
       "fieldConfig": {
        "defaults": {
         "unit": "short",
         "min": 0,
         "custom": {
          "lineWidth": 2,
          "fillOpacity": 10
         }
        },
        "overrides": []
       },
       "options": {
        "legend": {
         "displayMode": "table",
         "placement": "bottom",
         "calcs": [
          "lastNotNull",
          "max"
         ]
        },
        "tooltip": {
         "mode": "multi"
        }
       },
       "targets": [
        {
         "refId": "A",
         "expr": "sum by (pod) (rate(vllm:generation_tokens_total{pod=~\"$pod\"}[1m])) / on (pod) sum by (pod) (DCGM_FI_DEV_BOARD_POWER_WATTS{pod=~\"$pod\"})",
         "legendFormat": "{{pod}}"
        }
       ]
      },
      {
       "id": 18,
       "type": "table",
       "title": "Which Pod uses which GPU",
       "datasource": {
        "type": "prometheus",
        "uid": "${datasource}"
       },
       "gridPos": {
        "x": 16,
        "y": 32,
        "w": 8,
        "h": 8
       },
       "targets": [
        {
         "refId": "A",
         "expr": "sum by (namespace, pod, node, modelName) (DCGM_FI_DEV_FB_USED_BYTES{pod=~\"$pod\"})",
         "format": "table",
         "instant": true
        }
       ],
       "fieldConfig": {
        "defaults": {},
        "overrides": [
         {
          "matcher": {
           "id": "byName",
           "options": "Value"
          },
          "properties": [
           {
            "id": "unit",
            "value": "bytes"
           },
           {
            "id": "displayName",
            "value": "GPU memory"
           }
          ]
         }
        ]
       },
