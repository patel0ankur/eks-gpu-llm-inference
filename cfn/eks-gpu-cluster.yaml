AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Amazon EKS cluster for AI inference: new 3-AZ VPC (public + private subnets),
  EKS control plane with KMS-encrypted secrets and control-plane logging,
  a small CPU "system" node group, and a tainted GPU managed node group
  running the EKS-optimized NVIDIA AMI. The stack name is used as the cluster name.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: {default: Cluster}
        Parameters: [KubernetesVersion, ApiAccessCidr, AdminPrincipalArn]
      - Label: {default: GPU node group}
        Parameters: [GpuInstanceType, GpuAmiType, GpuCapacityType, GpuMinSize, GpuDesiredSize, GpuMaxSize, GpuDiskSizeGiB]
      - Label: {default: System (CPU) node group}
        Parameters: [SystemInstanceType, SystemDesiredSize]
      - Label: {default: Network}
        Parameters: [VpcCidr]

Parameters:
  KubernetesVersion:
    Type: String
    Default: ""
    AllowedPattern: '^$|^1\.[0-9]{2}$'
    Description: Kubernetes version, e.g. 1.33. Leave empty to use the EKS default version.

  ApiAccessCidr:
    Type: String
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'
    Description: >-
      CIDR allowed to reach the public Kubernetes API endpoint (your IP, e.g. 203.0.113.10/32).
      Nodes always use the private endpoint.

  AdminPrincipalArn:
    Type: String
    Default: ""
    AllowedPattern: '^$|^arn:aws[a-z-]*:iam::\d{12}:(role|user)/.+$'
    Description: >-
      Optional IAM role/user ARN to grant cluster-admin via an EKS access entry.
      The identity that creates the stack is granted admin automatically.

  GpuInstanceType:
    Type: String
    Default: g5.xlarge
    AllowedValues:
      - g4dn.xlarge
      - g4dn.2xlarge
      - g5.xlarge
      - g5.2xlarge
      - g5.4xlarge
      - g5.12xlarge
      - g6.xlarge
      - g6.2xlarge
      - g6.4xlarge
      - g6.12xlarge
      - g6e.xlarge
      - g6e.2xlarge
      - p4d.24xlarge
      - p5.48xlarge
    Description: GPU instance type (check Region/AZ availability and your G/P vCPU quota).

  GpuAmiType:
    Type: String
    Default: AL2023_x86_64_NVIDIA
    AllowedValues: [AL2023_x86_64_NVIDIA, BOTTLEROCKET_x86_64_NVIDIA]
    Description: >-
      EKS-optimized accelerated AMI. AL2023 includes the NVIDIA driver and container toolkit
      (install the NVIDIA device plugin after deploy). Bottlerocket NVIDIA also includes the device plugin.

  GpuCapacityType:
    Type: String
    Default: ON_DEMAND
    AllowedValues: [ON_DEMAND, SPOT]
    Description: ON_DEMAND for stable inference; SPOT is cheaper but can be interrupted.

  GpuMinSize:
    Type: Number
    Default: 0
    MinValue: 0
    MaxValue: 100
  GpuDesiredSize:
    Type: Number
    Default: 1
    MinValue: 0
    MaxValue: 100
  GpuMaxSize:
    Type: Number
    Default: 2
    MinValue: 1
    MaxValue: 100

  GpuDiskSizeGiB:
    Type: Number
    Default: 100
    MinValue: 50
    MaxValue: 2000
    Description: Root volume size; GPU images and model weights are large.

  SystemInstanceType:
    Type: String
    Default: m6i.large
    AllowedValues: [t3.large, m6i.large, m6i.xlarge, m7i.large, m7i.xlarge]
    Description: Instance type for cluster add-ons (CoreDNS, controllers, monitoring).

  SystemDesiredSize:
    Type: Number
    Default: 2
    MinValue: 1
    MaxValue: 10

  VpcCidr:
    Type: String
    Default: 10.0.0.0/16
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/16$'
    Description: /16 CIDR for the new VPC (split into 3 public /20 and 3 private /19 subnets).

Conditions:
  HasVersion: !Not [!Equals [!Ref KubernetesVersion, ""]]
  HasAdminPrincipal: !Not [!Equals [!Ref AdminPrincipalArn, ""]]

Resources:
  # ---------------------------------------------------------------- Network
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - {Key: Name, Value: !Sub "${AWS::StackName}-vpc"}

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - {Key: Name, Value: !Sub "${AWS::StackName}-igw"}

  VpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  # Public subnets: load balancers and the NAT gateway only (no public IPs on launch).
  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Select [0, !Cidr [!Ref VpcCidr, 16, 12]]
      MapPublicIpOnLaunch: false
      Tags:
        - {Key: Name, Value: !Sub "${AWS::StackName}-public-1"}
        - {Key: kubernetes.io/role/elb, Value: "1"}
  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Select [1, !Cidr [!Ref VpcCidr, 16, 12]]
      MapPublicIpOnLaunch: false
      Tags:
        - {Key: Name, Value: !Sub "${AWS::StackName}-public-2"}
        - {Key: kubernetes.io/role/elb, Value: "1"}
  PublicSubnet3:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [2, !GetAZs ""]
      CidrBlock: !Select [2, !Cidr [!Ref VpcCidr, 16, 12]]
      MapPublicIpOnLaunch: false
      Tags:
        - {Key: Name, Value: !Sub "${AWS::StackName}-public-3"}
        - {Key: kubernetes.io/role/elb, Value: "1"}

  # Private subnets: nodes and Pods (larger, because the VPC CNI gives every Pod a VPC IP).
  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Select [2, !Cidr [!Ref VpcCidr, 8, 13]]
      Tags:
        - {Key: Name, Value: !Sub "${AWS::StackName}-private-1"}
        - {Key: kubernetes.io/role/internal-elb, Value: "1"}
  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Select [3, !Cidr [!Ref VpcCidr, 8, 13]]
      Tags:
        - {Key: Name, Value: !Sub "${AWS::StackName}-private-2"}
        - {Key: kubernetes.io/role/internal-elb, Value: "1"}
  PrivateSubnet3:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [2, !GetAZs ""]
      CidrBlock: !Select [4, !Cidr [!Ref VpcCidr, 8, 13]]
      Tags:
        - {Key: Name, Value: !Sub "${AWS::StackName}-private-3"}
        - {Key: kubernetes.io/role/internal-elb, Value: "1"}

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - {Key: Name, Value: !Sub "${AWS::StackName}-public"}
  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: VpcGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  PublicSubnet1Assoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref PublicSubnet1, RouteTableId: !Ref PublicRouteTable}
  PublicSubnet2Assoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref PublicSubnet2, RouteTableId: !Ref PublicRouteTable}
  PublicSubnet3Assoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref PublicSubnet3, RouteTableId: !Ref PublicRouteTable}

  # Single NAT gateway keeps cost down; use one per AZ for production resilience.
  NatEip:
    Type: AWS::EC2::EIP
    DependsOn: VpcGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - {Key: Name, Value: !Sub "${AWS::StackName}-nat"}
  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEip.AllocationId
      SubnetId: !Ref PublicSubnet1
      Tags:
        - {Key: Name, Value: !Sub "${AWS::StackName}-nat"}

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - {Key: Name, Value: !Sub "${AWS::StackName}-private"}
  PrivateDefaultRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway
  PrivateSubnet1Assoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref PrivateSubnet1, RouteTableId: !Ref PrivateRouteTable}
  PrivateSubnet2Assoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref PrivateSubnet2, RouteTableId: !Ref PrivateRouteTable}
  PrivateSubnet3Assoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref PrivateSubnet3, RouteTableId: !Ref PrivateRouteTable}

  # ------------------------------------------------------------------- IAM
  ClusterRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: eks.amazonaws.com}
            Action: ["sts:AssumeRole", "sts:TagSession"]
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonEKSClusterPolicy"

  NodeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: ec2.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonEKSWorkerNodePolicy"
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonEKS_CNI_Policy"
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly"
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore"  # Session Manager instead of SSH

  SecretsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub "Envelope encryption for Kubernetes secrets in ${AWS::StackName}"
      EnableKeyRotation: true
      PendingWindowInDays: 7
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: AccountAdmin
            Effect: Allow
            Principal: {AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"}
            Action: "kms:*"
            Resource: "*"

  # ------------------------------------------------------------ EKS cluster
  ControlPlaneLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/eks/${AWS::StackName}/cluster"   # name EKS writes to
      RetentionInDays: 30

  Cluster:
    Type: AWS::EKS::Cluster
    DependsOn: ControlPlaneLogGroup
    Properties:
      Name: !Ref AWS::StackName
      Version: !If [HasVersion, !Ref KubernetesVersion, !Ref AWS::NoValue]
      RoleArn: !GetAtt ClusterRole.Arn
      AccessConfig:
        AuthenticationMode: API_AND_CONFIG_MAP
        BootstrapClusterCreatorAdminPermissions: true
      EncryptionConfig:
        - Provider: {KeyArn: !GetAtt SecretsKey.Arn}
          Resources: [secrets]
      Logging:
        ClusterLogging:
          EnabledTypes:
            - {Type: api}
            - {Type: audit}
            - {Type: authenticator}
      ResourcesVpcConfig:
        SubnetIds:
          - !Ref PrivateSubnet1
          - !Ref PrivateSubnet2
          - !Ref PrivateSubnet3
        EndpointPrivateAccess: true
        EndpointPublicAccess: true
        PublicAccessCidrs: [!Ref ApiAccessCidr]

  # IAM OIDC provider so Kubernetes service accounts can assume IAM roles (IRSA),
  # e.g. for the AWS Load Balancer Controller.
  OidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: !GetAtt Cluster.OpenIdConnectIssuerUrl
      ClientIdList: [sts.amazonaws.com]

  AdminAccessEntry:
    Type: AWS::EKS::AccessEntry
    Condition: HasAdminPrincipal
    Properties:
      ClusterName: !Ref Cluster
      PrincipalArn: !Ref AdminPrincipalArn
      AccessPolicies:
        - PolicyArn: !Sub "arn:${AWS::Partition}:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy"
          AccessScope: {Type: cluster}

  # ---------------------------------------------------------------- Add-ons
  VpcCniAddon:
    Type: AWS::EKS::Addon
    Properties:
      ClusterName: !Ref Cluster
      AddonName: vpc-cni
      ResolveConflicts: OVERWRITE
  KubeProxyAddon:
    Type: AWS::EKS::Addon
    Properties:
      ClusterName: !Ref Cluster
      AddonName: kube-proxy
      ResolveConflicts: OVERWRITE
  PodIdentityAddon:
    Type: AWS::EKS::Addon
    Properties:
      ClusterName: !Ref Cluster
      AddonName: eks-pod-identity-agent
      ResolveConflicts: OVERWRITE
  CoreDnsAddon:
    Type: AWS::EKS::Addon
    DependsOn: SystemNodeGroup          # CoreDNS needs nodes to become ACTIVE
    Properties:
      ClusterName: !Ref Cluster
      AddonName: coredns
      ResolveConflicts: OVERWRITE

  # ------------------------------------------------------------ Node groups
  # Launch templates enforce IMDSv2 and encrypted gp3 root volumes.
  SystemLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        MetadataOptions:
          HttpTokens: required
          HttpPutResponseHopLimit: 2      # lets Pods reach IMDS through the node
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs: {VolumeSize: 30, VolumeType: gp3, Encrypted: true, DeleteOnTermination: true}
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - {Key: Name, Value: !Sub "${AWS::StackName}-system"}

  GpuLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        MetadataOptions:
          HttpTokens: required
          HttpPutResponseHopLimit: 2
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs: {VolumeSize: !Ref GpuDiskSizeGiB, VolumeType: gp3, Encrypted: true, DeleteOnTermination: true}
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - {Key: Name, Value: !Sub "${AWS::StackName}-gpu"}

  SystemNodeGroup:
    Type: AWS::EKS::Nodegroup
    DependsOn: VpcCniAddon
    Properties:
      ClusterName: !Ref Cluster
      NodeRole: !GetAtt NodeRole.Arn
      AmiType: AL2023_x86_64_STANDARD
      CapacityType: ON_DEMAND
      InstanceTypes: [!Ref SystemInstanceType]
      LaunchTemplate: {Id: !Ref SystemLaunchTemplate, Version: !GetAtt SystemLaunchTemplate.LatestVersionNumber}
      Subnets: [!Ref PrivateSubnet1, !Ref PrivateSubnet2, !Ref PrivateSubnet3]
      ScalingConfig:
        MinSize: 1
        DesiredSize: !Ref SystemDesiredSize
        MaxSize: 10
      UpdateConfig: {MaxUnavailable: 1}
      Labels:
        workload: system

  GpuNodeGroup:
    Type: AWS::EKS::Nodegroup
    DependsOn: VpcCniAddon
    Properties:
      ClusterName: !Ref Cluster
      NodeRole: !GetAtt NodeRole.Arn
      AmiType: !Ref GpuAmiType
      CapacityType: !Ref GpuCapacityType
      InstanceTypes: [!Ref GpuInstanceType]
      LaunchTemplate: {Id: !Ref GpuLaunchTemplate, Version: !GetAtt GpuLaunchTemplate.LatestVersionNumber}
      Subnets: [!Ref PrivateSubnet1, !Ref PrivateSubnet2, !Ref PrivateSubnet3]
      ScalingConfig:
        MinSize: !Ref GpuMinSize
        DesiredSize: !Ref GpuDesiredSize
        MaxSize: !Ref GpuMaxSize
      UpdateConfig: {MaxUnavailable: 1}
      Labels:
        workload: gpu
        nvidia.com/gpu.present: "true"
      Taints:                              # only Pods that tolerate this land on GPU nodes
        - {Key: nvidia.com/gpu, Value: "true", Effect: NO_SCHEDULE}

Outputs:
  ClusterName:
    Description: EKS cluster name (same as the stack name)
    Value: !Ref Cluster
  ClusterEndpoint:
    Description: Kubernetes API endpoint
    Value: !GetAtt Cluster.Endpoint
  UpdateKubeconfigCommand:
    Description: Run this to configure kubectl
    Value: !Sub "aws eks update-kubeconfig --name ${Cluster} --region ${AWS::Region}"
  OidcProviderArn:
    Description: IAM OIDC provider ARN for IRSA roles
    Value: !Ref OidcProvider
  VpcId:
    Description: VPC ID (needed by the AWS Load Balancer Controller Helm chart)
    Value: !Ref Vpc
  PrivateSubnetIds:
    Description: Private subnets (nodes and Pods)
    Value: !Join [",", [!Ref PrivateSubnet1, !Ref PrivateSubnet2, !Ref PrivateSubnet3]]
  PublicSubnetIds:
    Description: Public subnets (internet-facing load balancers)
    Value: !Join [",", [!Ref PublicSubnet1, !Ref PublicSubnet2, !Ref PublicSubnet3]]
  NodeRoleArn:
    Description: IAM role used by both node groups
    Value: !GetAtt NodeRole.Arn
  ClusterSecurityGroupId:
    Description: EKS-managed cluster security group (attached to nodes)
    Value: !GetAtt Cluster.ClusterSecurityGroupId
